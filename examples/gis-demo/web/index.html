<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAF GIS Demo</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1c1f27;
    --border: #2a2e3a;
    --fg: #e6e8ee;
    --muted: #8b91a0;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  button, select, input[type="file"] {
    background: #262b37;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  select { cursor: pointer; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #dropHint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); pointer-events: none;
    flex-direction: column; gap: 8px; text-align: center;
  }
  #dropHint.hidden { display: none; }
  aside {
    width: 300px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    flex: 0 0 auto;
    transition: margin-right 0.2s ease, width 0.2s ease;
  }
  aside.collapsed { width: 0; border-left: none; overflow: hidden; }
  aside .panel-body { padding: 14px; }
  .group { margin-bottom: 18px; }
  .group h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0 0 8px;
  }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field label.checkbox { display: flex; align-items: center; gap: 6px; color: var(--fg); cursor: pointer; }
  .field label.checkbox input { cursor: pointer; }
  .field select { width: 100%; }
  .info-list { font-size: 12px; color: var(--muted); }
  .info-list .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .info-list .k { color: var(--muted); }
  .info-list .v { color: var(--fg); text-align: right; word-break: break-all; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: #2a3d5c; color: #a9c6ff; margin: 1px 2px;
  }
  #status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>CAF GIS Demo</h1>
  <button id="openBtn">Open .caf file</button>
  <input type="file" id="fileInput" accept=".caf" hidden />
  <span class="spacer"></span>
  <span id="status">No file loaded</span>
  <button id="toggleBtn">Settings</button>
</header>

<main>
  <div id="canvasWrap">
    <canvas id="map"></canvas>
    <div id="dropHint">
      <div>Drop a <code>.caf</code> file here, or click "Open .caf file".</div>
      <div style="font-size:12px">Static hosting · dynamic GIS — no backend.</div>
    </div>
  </div>

  <aside id="panel">
    <div class="panel-body">
      <div class="group">
        <h3>Projection</h3>
        <div class="field">
          <label>Display CRS</label>
          <select id="projSelect">
            <option value="4326">WGS84 — EPSG:4326 (degrees)</option>
            <option value="3857" selected>Web Mercator — EPSG:3857 (meters)</option>
            <option value="8857">Equal Earth — EPSG:8857 (meters)</option>
            <option value="54009">Mollweide — EPSG:54009 (meters)</option>
            <option value="54008">Sinusoidal — EPSG:54008 (meters)</option>
            <option value="54044">Hammer — EPSG:54044 (meters)</option>
            <option value="54045">Winkel I — EPSG:54045 (meters)</option>
          </select>
        </div>
      </div>

      <div class="group">
        <h3>Objects</h3>
        <div class="field">
          <label>Layer</label>
          <select id="layerSelect">
            <option value="all">All layers</option>
            <option value="Africa">Africa</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="North America">North America</option>
            <option value="South America">South America</option>
            <option value="Oceania">Oceania</option>
            <option value="Antarctica">Antarctica</option>
            <option value="Seven seas (open ocean)">Seven seas</option>
          </select>
        </div>
      </div>

      <div class="group">
        <h3>Payload format</h3>
        <div class="field">
          <label class="checkbox">
            <input type="checkbox" id="fmtGeojson" checked />
            global.geo.json (GeoJSON)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="fmtWkb" />
            global.wkb (WKB)
          </label>
        </div>
      </div>

      <div class="group">
        <h3>Artifact</h3>
        <div class="info-list" id="artifactInfo"></div>
      </div>

      <div class="group">
        <h3>Capabilities</h3>
        <div id="capsInfo"></div>
      </div>

      <div class="group">
        <h3>Payload files</h3>
        <div class="info-list" id="payloadInfo"></div>
      </div>

      <div class="group">
        <h3>WASM exports</h3>
        <div id="exportsInfo"></div>
      </div>
    </div>
  </aside>
</main>

<script src="caf.js"></script>
<script src="app.js"></script>
</body>
</html>
