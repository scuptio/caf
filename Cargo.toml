[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Shared dependency versions. Individual crates inherit these via
# `serde = { workspace = true }` so the whole workspace stays consistent.
[workspace.dependencies]
# Serde / serialization.
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
ciborium = "0.2"

# Hashing / crypto.
sha2 = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }

# WASM parsing (component export inspection; lightweight, no codegen).
wasmparser = "0.262"

# WASM host runtime.
wasmtime = "50"

# Internal crates.
caf-core = { path = "crates/core" }
caf-runtime = { path = "crates/runtime" }
caf-security = { path = "crates/security" }

# Misc.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
