[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Shared dependency versions. Individual crates inherit these via
# `serde = { workspace = true }` so the whole workspace stays consistent.
[workspace.dependencies]
# Serde / serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Hashing / crypto.
sha2 = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# WASM runtime + component model.
wasmtime = { version = "47", features = ["component-model"] }
wasmtime-wasi = "47"
wit-bindgen = "0.42"

# Async + HTTP range requests.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
bytes = "1"

# Misc.
thiserror = "2"
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
flate2 = "1"
zstd = "0.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
