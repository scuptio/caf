[package]
name = "caf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
caf-core = { path = "../crates/core" }
ciborium = "0.2"

[[bin]]
name = "verify_bytes"
path = "fuzz_targets/verify_bytes.rs"
test = false
doc = false

[[bin]]
name = "parse_container"
path = "fuzz_targets/parse_container.rs"
test = false
doc = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false

[workspace]
